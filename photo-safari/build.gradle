plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom { splitEnvironmentSourceSets() }

fabricApi { configureDataGeneration { client = true } }

loom {
    runs {
        gametest {
            inherit server
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

sourceSets {
    client { }
}

// Camerapture is vendored into this mod rather than depended on — see vendor/camerapture/NOTICE.
// Its sources sit apart from ours so the copy stays a copy: re-importing it is a directory swap.
sourceSets.main.java.srcDir 'vendor/camerapture/src/main/java'
sourceSets.main.resources.srcDir 'vendor/camerapture/src/main/resources'
sourceSets.client.java.srcDir 'vendor/camerapture/src/client/java'
sourceSets.client.resources.srcDir 'vendor/camerapture/src/client/resources'

// Camerapture's own access widener, which its mixins and menus need.
loom { accessWidenerPath = file('vendor/camerapture/src/main/resources/camerapture.accesswidener') }

loom {
    mods {
        "photosafari" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The camera, pictures, albums and picture frames are Camerapture's, vendored into this mod
    // (vendor/camerapture) instead of installed beside it. WebP encoding is all it needs from
    // outside, and that rides along inside the jar so players install nothing extra.
    implementation include("dev.matrixlab.webp4j:webp4j-core:${project.webp4j_version}")

    // Mod Menu supplies the config button only. The entrypoint that touches its API is never
    // loaded without it, so the published jar works fine on its own — compile-only here,
    // present in runClient so the screen can actually be opened in dev.
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Datagen only: their mobs get checklist advancements, gated behind a resource
    // condition so the same jar still works without them installed.
    implementation "maven.modrinth:alexs-mobs-continued:${project.alexs_mobs_version}"
    implementation "maven.modrinth:codxlib:${project.codxlib_version}"

    testImplementation platform('org.junit:junit-bom:6.1.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
